# Construye el instalador de Windows y lo adjunta a la Release (TA-06).
#
# - Al publicar una Release: genera QAgent-<versión>-instalador.exe y lo sube a esa Release.
# - A mano (Actions > Instalador de Windows > Run workflow): lo deja como artefacto
#   descargable del workflow, para probarlo sin publicar nada.
name: Instalador de Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # subir el instalador a la Release

jobs:
  instalador:
    name: Construir el instalador
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.17"
      - name: Dependencias (con PyInstaller, versiones fijadas)
        run: python -m pip install -c packaging/constraints.txt -c packaging/runtime-windows-py313.lock.txt -e ".[dev,empaquetar]"
      - name: Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: QAgent.exe e instalador
        run: python scripts/construir_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-windows
          path: dist/windows/*-instalador.exe
      - name: Adjuntar a la Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem dist/windows/*-instalador.exe | ForEach-Object {
            gh release upload "${{ github.ref_name }}" $_.FullName --clobber
          }
