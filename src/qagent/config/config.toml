# QAgent — configuración del equipo (este archivo se versiona y lo comparte todo el equipo)
# Las claves NO van aquí: van en .env, que no se sube al repositorio
# Fuente de modelos y precios: docs/decisiones/ADR-001-modelos.md

[presupuesto]
tope_por_corrida_usd = 1.00      # banco propio; subir a 7.00 para repositorios externos
tope_semestre_usd = 25.00
max_tokens_por_corrida = 200000   # red de seguridad independiente del precio (A1)

[reintentos]
max_intentos = 3

# Metas de calidad por corrida (ADR-001: Pass Rate 70–80 %, cobertura de líneas ≥ 60 %,
# iteraciones promedio < 2)
[umbrales]
pass_rate_min = 70               # % de pruebas aprobadas
cobertura_lineas_min = 60        # % de líneas cubiertas
iteraciones_promedio_max = 2.0   # intentos promedio por prueba

# Mutation testing (EN-09): mutmut solo corre sobre las funciones marcadas para
# profundizar, nunca sobre el repositorio completo. Si se agota el tiempo, la función
# queda como «tiempo agotado» sin Mutation Score y la corrida sigue.
[mutacion]
tiempo_maximo_por_funcion_s = 120   # segundos por función crítica

# Pruebas de integración interna (#245, ADR-014): una función raíz se prueba junto con las
# funciones internas que llama. Estos límites acotan la cadena; si hay más, se recorta y el
# informe lo dice.
[integracion]
profundidad_max = 2   # niveles de llamadas internas desde la raíz
max_funciones = 4      # funciones por cadena, contando la raíz

# Contrato inferido para funciones sin docstring (#275, ADR-016): el Planner infiere los
# casos leyendo el código y su contexto (nunca ejecutándolo) y los marca como `inferido`.
# Con `activa = false` esas funciones se omiten como antes.
[inferencia]
activa = true
max_funciones_por_modulo = 20    # funciones sin contrato que se infieren por módulo
max_caracteres_contexto = 6000   # contexto estático por función (cuerpo, llamadores, tests)

# Límites de cada contenedor del sandbox Docker (EN-03). Si Docker Desktop tiene menos
# CPU asignados que `cpus`, se usan los que tenga. La memoria es también el tope de swap.
# Solo los cambia el equipo aquí: ~/.qagent/config.local.toml no puede tocarlos.
[sandbox]
cpus = 4
memoria = "3g"                   # formato Docker: "512m", "2g", "3g"...
timeout_s = 120                  # segundos por ejecución; el paso del orquestador espera más

# Límites por lenguaje (#169): solo `memoria` y `timeout_s`; lo que falte (y los CPU) se
# toma de [sandbox], que es también el de Python. Medidos en docs/arquitectura.md (sección 7).
# Rango soportado por QAgent (ADR-013): 3.10–3.14. Fuera del rango la corrida se detiene.
versiones_python = ["3.10", "3.11", "3.12", "3.13", "3.14"]
version_python_por_defecto = "3.11"

[sandbox.javascript]
memoria = "2g"
timeout_s = 120

[sandbox.typescript]
memoria = "2g"
timeout_s = 120

[sandbox.java]
memoria = "4g"                   # la JVM (Maven/Gradle + JUnit + JaCoCo) necesita más
timeout_s = 300                  # arranque de la JVM y compilación antes de las pruebas

# Espacio en disco del sandbox (#267). Docker guarda las imágenes en un disco virtual que en
# Windows no se achica solo; sin estos límites unas pocas imágenes de dependencias llenan C:.
# Solo los cambia el equipo aquí: ~/.qagent/config.local.toml no puede tocarlos. Un valor
# que falte o no sea un número mayor que 0 desactiva ese límite (nunca se borra ni bloquea
# por un valor ilegible).
[disco]
tope_imagenes_derivadas_gb = 10  # suma de las imágenes req-, node-, java- y browser-; al superarla
                                 # se borran las menos usadas (nunca la base ni la de la corrida en curso)
cache_antiguedad_dias = 7        # solo en «Liberar espacio» (manual, con confirmación): poda la caché de Docker sin usar en más de esto
espacio_libre_minimo_gb = 10     # por debajo, no se construye ni se descarga ninguna imagen

# Cada agente usa la URL de chat de su proveedor (src/qagent/llm/fabrica.py).
# Para otra URL agrega:  endpoint = "https://.../v1/chat/completions"
# `esfuerzo` se envía como `reasoning_effort`; quítalo si el proveedor no lo acepta.
[agentes.planner]

proveedor = "xiaomi"
modelo = "mimo-v2.6-pro"
precio_entrada_usd_m = 0.435
precio_salida_usd_m = 0.87
precio_cache_lectura_usd_m = 0.0036

# proveedor = "anthropic"
# modelo = "claude-opus-5-5"
# esfuerzo = "max"
# precio_entrada_usd_m = 4.00
# precio_salida_usd_m = 20.00
# precio_cache_lectura_usd_m = 0.20

[agentes.generator]
proveedor = "xiaomi"
modelo = "mimo-v2.6-pro"
precio_entrada_usd_m = 0.435
precio_salida_usd_m = 0.87
precio_cache_lectura_usd_m = 0.0036

[agentes.reviewer]
proveedor = "openai"
modelo = "gpt-6-luna"            # ID confirmado en developers.openai.com/api/docs/models
esfuerzo = "max"
precio_entrada_usd_m = 0.10
precio_salida_usd_m = 0.50
precio_cache_lectura_usd_m = 0.01
# Si la entrada supera 272K tokens, toda la petición cuesta 0.20 / 0.75

# Agente Explicador (HU-32, ADR-008): después del veredicto explica en palabras simples
# por qué no pasó cada función. Es obligatorio como los demás agentes (EP-10 #172): se
# configura en Configuración → «Agregar API» (clave: OPENAI_API_KEY_EXPLICADOR en .env).
# Con modo = "ia" (#166) un LLM redacta cada explicación leyendo todos los intentos; si
# falla, tarda más de tiempo_maximo_s o se agota el presupuesto, se usa la plantilla sin
# IA (0 tokens).
[agentes.explicador]
activo = true
modo = "ia"
proveedor = "openai"
modelo = "gpt-6-luna"
precio_entrada_usd_m = 0.10
precio_salida_usd_m = 0.50
tiempo_maximo_s = 60             # segundos por explicación; al vencer, plantilla

# Agente Recomendador (EP-15, ADR-011): en Vista previa sugiere qué tipos de prueba hacer.
# Con modo = "reglas" usa reglas sin IA (0 tokens) y es el valor predeterminado. Con
# modo = "ia" (#200) un LLM ordena y explica esos mismos tipos, nunca agrega otros, y las
# reglas quedan de respaldo. Sigue apagado hasta medir utilidad, costo y latencia (#201).
# Para probarlo, copia la sección a config.local.toml con modo = "ia" y descomenta
# proveedor, modelo y precios (clave: OPENAI_API_KEY_RECOMENDADOR u OPENAI_API_KEY en
# .env). Sin clave, con error o pasado el tiempo máximo se usan las reglas.
[agentes.recomendador]
modo = "reglas"
# proveedor = "openai"
# modelo = "gpt-6-luna"
# precio_entrada_usd_m = 0.10
# precio_salida_usd_m = 0.50
# tiempo_maximo_s = 30           # segundos por recomendación; al vencer, reglas


# Catálogo único de modelos, precios y proveedores (ADR-001).
# Tarifas contrastadas el 13/11/2026: https://mimo.mi.com/docs/en-US/pricing
# y https://ai.google.dev/gemini-api/docs/pricing.md
[proveedores.anthropic]
nombre = "Anthropic"
variable = "ANTHROPIC_API_KEY"
endpoint = "https://api.anthropic.com/v1/chat/completions"
modelos_url = "https://api.anthropic.com/v1/models"
cabecera_clave = "x-api-key"
tipo = "texto"
modelos = [
  { id = "claude-opus-5-5", nombre = "Claude Opus 5.5", entrada = 4.00, salida = 20.00 },
  { id = "claude-sonnet-5-5", nombre = "Claude Sonnet 5.5" },
  { id = "claude-haiku-5-5", nombre = "Claude Haiku 5.5" },
  { id = "claude-fable-5-1", nombre = "Claude Fable 5.1" },
]

[proveedores.xiaomi]
nombre = "Xiaomi MiMo"
variable = "XIAOMI_API_KEY"
endpoint = "https://api.xiaomimimo.com/v1/chat/completions"
modelos_url = "https://api.xiaomimimo.com/v1/models"
cabecera_clave = "api-key"
tipo = "texto"
modelos = [
  { id = "mimo-v2.6-pro", nombre = "MiMo v2.6 Pro", entrada = 0.435, salida = 0.87 },
  { id = "mimo-v2.6-flash", nombre = "MiMo v2.6 Flash", entrada = 0.14, salida = 0.28 },
]

[proveedores.openai]
nombre = "OpenAI"
variable = "OPENAI_API_KEY"
endpoint = "https://api.openai.com/v1/chat/completions"
modelos_url = "https://api.openai.com/v1/models"
param_limite = "max_completion_tokens"
tipo = "texto"
modelos = [
  { id = "gpt-6-luna", nombre = "GPT-6 Luna", entrada = 0.10, salida = 0.50 },
  { id = "gpt-6.1-terra", nombre = "GPT-6.1 Terra", entrada = 1.00, salida = 5.00 },
  { id = "gpt-6.1-sol", nombre = "GPT-6.1 Sol", entrada = 2.00, salida = 10.00 },
]

# API compatible con OpenAI: se reutiliza esa integración. Los modelos llevan el
# nombre completo de OpenRouter (`<empresa>/<modelo>`).
# Solo modelos gratuitos (`:free`), que no piden crédito en la cuenta. Revisados el
# 2026-10-17 en https://openrouter.ai/api/v1/models (16 `:free`); la lista cambia
# seguido: `python -m qagent.llm.validar --gratis` muestra la de hoy. Quedan fuera los
# que no sirven como agente: el de moderación (nemotron-3.5-content-safety), uno
# demasiado chico para escribir pruebas (liquid/lfm-2.5-2.6b) y el enrutador
# `openrouter/free`, que elige el modelo solo y no deja saber cuál respondió.
# Los Gemma 4 (google/gemma-4-*) siguen en la lista pública pero no respondían: se
# quitaron para no confundir.
# Todos razonan antes de responder: son más lentos que un modelo sin razonamiento.
[proveedores.openrouter]
nombre = "OpenRouter"
variable = "OPENROUTER_API_KEY"
endpoint = "https://openrouter.ai/api/v1/chat/completions"
modelos_url = "https://openrouter.ai/api/v1/models"
tipo = "texto"
modelos = [
  { id = "nvidia/nemotron-3-super-120b-a12b:free", nombre = "Nemotron 3 Super 120B (gratis)", entrada = 0, salida = 0 },
  { id = "nvidia/nemotron-3-ultra-550b-a55b:free", nombre = "Nemotron 3 Ultra 550B (gratis)", entrada = 0, salida = 0 },
  { id = "nvidia/nemotron-3.5-lightning:free", nombre = "Nemotron 3.5 Lightning (gratis)", entrada = 0, salida = 0 },
  { id = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", nombre = "Nemotron 3 Nano Omni 30B (gratis)", entrada = 0, salida = 0 },
  { id = "nvidia/nemotron-3.5-super-vl:free", nombre = "Nemotron 3.5 Super VL (gratis)", entrada = 0, salida = 0 },
  { id = "cohere/north-mini-code:free", nombre = "Cohere North Mini Code (gratis)", entrada = 0, salida = 0 },
  { id = "poolside/laguna-s-2.1:free", nombre = "Poolside Laguna S 2.1 (gratis)", entrada = 0, salida = 0 },
  { id = "poolside/laguna-xs-2.1:free", nombre = "Poolside Laguna XS 2.1 (gratis)", entrada = 0, salida = 0 },
  { id = "thinkingmachines/inkling:free", nombre = "Thinking Machines Inkling (gratis)", entrada = 0, salida = 0 },
  { id = "thinkingmachines/inkling-small:free", nombre = "Thinking Machines Inkling Small (gratis)", entrada = 0, salida = 0 },
  { id = "xingchen-agi/xing4.0-29b-a4b:free", nombre = "XingChen Xing4.0 29B A4B (gratis)", entrada = 0, salida = 0 },
  { id = "dots-studio/dots-3-note-preview:free", nombre = "Dots3-Note Preview (gratis)", entrada = 0, salida = 0 },
]

[proveedores.gemini]
nombre = "Google Gemini"
variable = "GEMINI_API_KEY"
endpoint = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
modelos_url = "https://generativelanguage.googleapis.com/v1beta/openai/models"
tipo = "texto"
modelos = [
  { id = "gemini-3.8-flash", nombre = "Gemini 3.8 Flash (verificar)" },
  { id = "gemini-2.5-flash", nombre = "Gemini 2.5 Flash", entrada = 0.30, salida = 2.50 },
  { id = "gemini-2.5-flash-lite", nombre = "Gemini 2.5 Flash-Lite", entrada = 0.10, salida = 0.40 },
]

# Groq: solo los modelos de texto de su capa gratuita (Free Plan), revisados el
# 2026-10-14 en https://console.groq.com/docs/rate-limits. Los Llama pasaron a
# Enterprise y no están en la capa gratuita; los modelos de moderación (prompt-guard,
# safeguard), de voz (Orpheus) y de audio (Whisper) no sirven como agente.
[proveedores.groq]
nombre = "Groq"
variable = "GROQ_API_KEY"
endpoint = "https://api.groq.com/openai/v1/chat/completions"
modelos_url = "https://api.groq.com/openai/v1/models"
tipo = "texto"
modelos = [
  { id = "openai/gpt-oss-120b", nombre = "GPT-OSS 120B (gratis)", entrada = 0, salida = 0 },
  { id = "openai/gpt-oss-20b", nombre = "GPT-OSS 20B (gratis)", entrada = 0, salida = 0 },
  { id = "qwen/qwen3.8-27b", nombre = "Qwen 3.8 27B (gratis)", entrada = 0, salida = 0 },
]

# DeepSeek (HU-36): alternativa económica. Revisado el 2026-10-19 en
# https://api-docs.deepseek.com/quick_start/pricing. El `id` es el nombre que acepta la
# API (`deepseek-flash` sirve hoy la versión DeepSeek-V4.1-Flash-1017 y
# `deepseek-v4-pro` la V4-Pro-0813), no la versión fechada. DeepSeek cobra la mitad
# fuera de hora punta; aquí va el precio de hora punta para que el tope por corrida no
# se quede corto.
[proveedores.deepseek]
nombre = "DeepSeek"
variable = "DEEPSEEK_API_KEY"
endpoint = "https://api.deepseek.com/chat/completions"
modelos_url = "https://api.deepseek.com/models"
tipo = "texto"
modelos = [
  { id = "deepseek-flash", nombre = "DeepSeek V4.1 Flash", entrada = 0.30, salida = 1.20 },
  { id = "deepseek-v4-pro", nombre = "DeepSeek V4 Pro", entrada = 1.32, salida = 3.96 },
]
